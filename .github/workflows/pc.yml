name: Gerar programa para PC

on:
  push:
    branches: [main]
    paths: ["index.html", "*.png", "desktop/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar e gerar o .exe
        shell: bash
        run: |
          cd desktop
          mkdir -p app
          cp ../index.html ../manifest.webmanifest ../*.png app/
          npm i --no-audit --no-fund -D electron@33.2.0 electron-builder@25.1.8
          npx electron-builder --win --publish never
          ls -la dist
      - name: Publicar para download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc --yes --cleanup-tag || true
          gh release create pc desktop/dist/Gastei-Setup.exe desktop/dist/Gastei-PC.exe --title "Gastei para PC (Windows)" --notes "Gastei-Setup.exe: instala o Gastei no Windows, com ícone na área de trabalho e no menu Iniciar. Gastei-PC.exe: versão portátil, abre sem instalar. Os dois mostram o Gastei numa janela em formato de celular e guardam seus dados no computador." --latest=false
