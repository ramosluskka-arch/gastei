name: Gerar APK Android

on:
  push:
    branches: [main]
    paths: ["index.html", "manifest.webmanifest", "*.png", "android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Montar projeto Capacitor
        run: |
          mkdir -p build/www
          cp index.html manifest.webmanifest *.png build/www/
          cd build
          npm init -y >/dev/null
          npm i @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/local-notifications@8.3.1 @capacitor/filesystem@8.1.5 @capacitor/share@8.0.3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.gastei.app",
            "appName": "Gastei",
            "webDir": "www",
            "android": { "allowMixedContent": false, "webContentsDebuggingEnabled": false },
            "plugins": { "SystemBars": { "insetsHandling": "native" } }
          }
          JSON
          # appId e o endereco interno (https://localhost) nunca podem mudar: e onde ficam os dados do app
          npx cap add android
          npx cap sync android
      - name: Ícones, tela de abertura e impressão em PDF
        run: |
          cd build/android/app/src/main
          cp "$GITHUB_WORKSPACE"/android/*.java java/com/gastei/app/
          cp -r "$GITHUB_WORKSPACE"/android/res/* res/
          python3 - <<'PY2'
          p = "AndroidManifest.xml"; m = open(p).read()
          rcv = '<receiver android:name=".GasteiWidgetProvider" android:exported="true" android:label="Gastei"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/gastei_widget_info"/></receiver>'
          q = '<queries><intent><action android:name="android.speech.action.RECOGNIZE_SPEECH"/></intent></queries>'
          m = m.replace("</application>", rcv + "\n</application>", 1).replace("</manifest>", q + "\n</manifest>", 1)
          perm = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
          m = m.replace("</manifest>", perm + "\n</manifest>", 1).replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
          if "xmlns:tools" not in m: m = m.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          m = m.replace("</manifest>", '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove"/><uses-permission android:name="android.permission.USE_EXACT_ALARM" tools:node="remove"/>\n</manifest>', 1)
          open(p, "w").write(m)
          print(m)
          PY2
          pip install --quiet pillow
          python3 - "$GITHUB_WORKSPACE/android/icon" <<'PY'
          import sys, glob, os
          from PIL import Image
          D = sys.argv[1]
          legacy = Image.open(D + "/legacy.png").convert("RGBA")
          fg = Image.open(D + "/foreground.png").convert("RGBA")
          bg = Image.open(D + "/background.png").convert("RGB")
          dens = {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}
          for d, k in dens.items():
              os.makedirs("res/mipmap-" + d, exist_ok=True)
              w = round(48 * k); a = round(108 * k)
              legacy.resize((w, w), Image.LANCZOS).save("res/mipmap-%s/ic_launcher.png" % d)
              legacy.resize((w, w), Image.LANCZOS).save("res/mipmap-%s/ic_launcher_round.png" % d)
              fg.resize((a, a), Image.LANCZOS).save("res/mipmap-%s/ic_launcher_foreground.png" % d)
              bg.resize((a, a), Image.LANCZOS).save("res/mipmap-%s/ic_launcher_background.png" % d)
          os.makedirs("res/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@mipmap/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/><monochrome android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n'
          for n in ("ic_launcher", "ic_launcher_round"):
              open("res/mipmap-anydpi-v26/%s.xml" % n, "w").write(xml)
          for f in glob.glob("res/drawable*/splash.png"):
              W, H = Image.open(f).size
              m = min(W, H) // 3
              sp = Image.new("RGBA", (W, H), (91, 10, 160, 255))
              ic = legacy.resize((m, m), Image.LANCZOS)
              sp.paste(ic, ((W - m) // 2, (H - m) // 2), ic)
              sp.convert("RGB").save(f)
          for f in glob.glob("res/values*/*.xml"):
              t = open(f).read()
              if "ic_launcher_background" in t:
                  open(f, "w").write(t.replace("#FFFFFF", "#5B0AA0").replace("#ffffff", "#5B0AA0"))
          PY
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.android.billingclient:billing:8.0.0"/' ../../build.gradle
          grep -n "billingclient" ../../build.gradle
          # versionCode sempre maior que o anterior (minutos desde 2025): o Android so aceita atualizar para um numero maior
          VC=$(( $(date +%s) / 60 - 29000000 ))
          AV=$(grep -o 'APP_VER="[0-9]*"' "$GITHUB_WORKSPACE/index.html" | grep -o '[0-9]\+')
          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"$AV.$GITHUB_RUN_NUMBER\"/" ../../build.gradle
      - name: Compilar e assinar
        run: |
          cd build/android
          chmod +x gradlew
          grep -E "compileSdk|targetSdk|minSdk" variables.gradle || true
          for t in 1 2 3 4; do ./gradlew assembleRelease bundleRelease --no-daemon -q && break; [ $t = 4 ] && exit 1; echo "Tentando de novo em $((t*45))s"; sleep $((t*45)); done
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # Sempre a MESMA chave: so assim a versao nova instala por cima da antiga sem apagar os dados.
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Faltam os segredos GASTEI_KEYSTORE e GASTEI_KEYSTORE_PASS. Sem a chave fixa o APK nao atualiza por cima; nada foi publicado."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > ks.jks
          $BT/apksigner sign --ks ks.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias gastei --out "$GITHUB_WORKSPACE/Gastei.apk" aligned.apk
          $BT/apksigner verify --print-certs "$GITHUB_WORKSPACE/Gastei.apk" | tee certs.txt
          # confere que e a chave oficial do Gastei (impressao digital SHA-256)
          grep -qi "SHA-256 digest: e593e8680ed408ffc28a31747b945d656f456537c3703b47d9d2ad3c64ba60e8" certs.txt || { echo "::error::O APK nao foi assinado com a chave oficial do Gastei."; exit 1; }
          if true; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Gastei.aab"
            jarsigner -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$GITHUB_WORKSPACE/Gastei.aab" gastei
            jarsigner -verify "$GITHUB_WORKSPACE/Gastei.aab" | tail -1
          else
            echo "::warning::O pacote para a Play Store (Gastei.aab) so e gerado com a chave fixa nos segredos."
          fi
        env:
          KS_B64: ${{ secrets.GASTEI_KEYSTORE }}
          KS_PASS: ${{ secrets.GASTEI_KEYSTORE_PASS }}
      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          FILES="Gastei.apk"; [ -f Gastei.aab ] && FILES="$FILES Gastei.aab"
          gh release create app $FILES --title "Gastei para Android" --notes "Gastei.apk: baixe e abra no celular para instalar. Gastei.aab (quando existir): pacote para enviar na Play Store." --latest
